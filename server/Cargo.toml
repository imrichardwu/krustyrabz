[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
poker_core = { path = "../core" }
storage = { path = "../storage" }
rand = "0.9"
strum = "0.27"
strum_macros = "0.27"
rocket = { version = "0.5", features = ["json"] }
rocket_ws = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = { workspace = true }
