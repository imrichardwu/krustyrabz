[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
poker_core = { path = "../core" }
storage = { path = "../storage" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
uuid = { version = "1.0", features = ["v4"] }
rand = "0.9.2"
rocket = { version = "0.5.1", features = ["json"] }
maud = { version = "0.26" }
dashmap = "5.5"
